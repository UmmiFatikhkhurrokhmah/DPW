<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        label {
            display: inline-block;
            width: 160px;
            font-weight: bold;
        }

        input,
        textarea {
            margin: 5px 0;
            padding: 4px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            padding: 5px 8px;
        }

        input[type="submit"] {
            margin-top: 10px;
            padding: 6px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Form Pendaftaran</h2>
    <form method="POST" action="proses_pendaftaran.php">
        <table>
            <tr>
                <td><label>Nim :</label></td>
                <td><input type="text" name="nim" placeholder="nim"></td>
            </tr>
            <tr>
                <td><label>Nama Lengkap :</label></td>
                <td><input type="text" name="nama" placeholder="nama"></td>
            </tr>
            <tr>
                <td><label>E-mail :</label></td>
                <td><input type="email" name="email" placeholder="email"></td>
            </tr>
            <tr>
                <td><label>Tempat, Tanggal Lahir :</label></td>
                <td>
                    <input type="text" name="tempat" placeholder="tempat">
                    <input type="date" name="tgl_lahir">
                </td>
            </tr>
            <tr>
                <td><label>Alamat :</label></td>
                <td><textarea name="alamat" rows="3" cols="30" placeholder="Alamat"></textarea></td>
            </tr>
            <tr>
                <td><label>Gender :</label></td>
                <td>
                    <input type="radio" name="gender" value="Laki-Laki"> Laki-Laki
                    <input type="radio" name="gender" value="Perempuan" checked> Perempuan
                    <span>Gender</span>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="kirim"></td>
            </tr>
        </table>
    </form>
</body>

</html>
